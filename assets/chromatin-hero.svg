<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 557" role="img" aria-labelledby="title desc"><title id="title">Genomic measurement and regulatory inference</title><desc id="desc">Measured accessibility and chromatin-associated signal are separated from an inferred candidate enhancer–gene link; the illustration highlights the need for perturbation and controls.</desc><rect width="1190" height="557" fill="#FFFEFB"/><text x="50" y="59" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#4A3024">Observe the signal. Test the mechanism.</text><text x="51" y="91" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#73533F">Evidence in regulatory genomics moves from a measurement to a hypothesis</text><rect x="42" y="124" width="539" height="363" rx="17" fill="#F8F5EF" stroke="#E8DCCF"/><rect x="607" y="124" width="539" height="363" rx="17" fill="#F4EAE0" stroke="#E8DCCF"/><text x="68" y="164" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#A97A51">MEASUREMENT</text><text x="632" y="164" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#A97A51">INFERENCE</text><text x="70" y="218" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#4A3024">Accessible DNA intervals</text><rect x="89" y="237" width="42" height="19" rx="3" fill="#A97A51"/><rect x="179" y="237" width="83" height="19" rx="3" fill="#A97A51"/><rect x="343" y="237" width="48" height="19" rx="3" fill="#A97A51"/><rect x="451" y="237" width="73" height="19" rx="3" fill="#A97A51"/><text x="70" y="313" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#4A3024">Histone-associated signal</text><path d="M88 426.7 L95.4 426.4 L102.8 426.0 L110.2 425.4 L117.6 424.4 L125 423.1 L132.4 421.2 L139.8 418.7 L147.2 415.5 L154.60000000000002 411.5 L162 406.8 L169.4 401.4 L176.8 395.7 L184.2 389.8 L191.60000000000002 384.2 L199 379.2 L206.4 375.3 L213.8 372.9 L221.20000000000002 372.0 L228.6 372.9 L236 375.3 L243.4 379.2 L250.8 384.2 L258.20000000000005 389.8 L265.6 395.7 L273 401.4 L280.4 406.8 L287.8 411.5 L295.20000000000005 415.5 L302.6 418.7 L310 421.2 L317.4 423.1 L324.8 424.4 L332.20000000000005 425.3 L339.6 425.9 L347 426.3 L354.40000000000003 426.3 L361.8 426.1 L369.2 425.4 L376.6 423.9 L384 421.5 L391.40000000000003 417.7 L398.8 412.6 L406.2 406.4 L413.6 399.8 L421 393.8 L428.40000000000003 389.5 L435.8 388.0 L443.20000000000005 389.5 L450.6 393.8 L458 399.8 L465.40000000000003 406.4 L472.8 412.7 L480.20000000000005 417.8 L487.6 421.5 L495 424.0 L502.40000000000003 425.5 L509.8 426.3 L517.2 426.7 L524.6 426.9 L532 427.0" fill="none" stroke="#4A3024" stroke-width="4"/><text x="632" y="217" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024">Candidate enhancer</text><rect x="650" y="255" width="151" height="24" rx="8" fill="#A97A51"/><path d="M802 266 Q866 205 938 265" stroke="#73533F" fill="none" stroke-width="3" stroke-dasharray="8 6"/><rect x="939" y="255" width="169" height="24" rx="7" fill="#4A3024"/><text x="954" y="310" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#73533F">Putative target gene</text><rect x="636" y="354" width="468" height="84" rx="9" fill="#FFFEFB" stroke="#E8DCCF"/><text x="659" y="389" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#4A3024">Causality requires perturbation</text><text x="659" y="416" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#4A3024">and appropriate experimental controls.</text><text x="48" y="527" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#73533F">Conceptual illustration only. Alignment and contact evidence cannot alone prove enhancer–gene regulation.</text></svg>
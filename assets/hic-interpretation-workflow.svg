<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 495" role="img" aria-labelledby="t d"><title id="t">From Hi-C measurements to biological interpretation</title><desc id="d">Five stage interpretation workflow: experimental measurement and QC, matrix transformation, feature inference, biological hypothesis, orthogonal validation. Each card emphasizes what is known and what remains inferred.</desc><rect width="1120" height="495" fill="#FFFEFB"/><text x="48" y="53" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="35">The evidence ladder</text><text x="48" y="85" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">A darker pixel is not automatically a stronger biological claim.</text><rect x="49" y="117" width="328" height="138" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="69" y="154" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">1. Measured contacts</text><text x="69" y="189" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Valid pairs, coverage and</text><text x="69" y="214" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">distance decay; replicate QC</text><rect x="396" y="117" width="328" height="138" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="416" y="154" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">2. Matrix processing</text><text x="416" y="189" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Binning, normalization and</text><text x="416" y="214" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">matched display assumptions</text><rect x="743" y="117" width="328" height="138" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="763" y="154" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">3. Feature detection</text><text x="763" y="189" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Compartments, boundaries,</text><text x="763" y="214" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">focal peaks and stripes</text><rect x="220" y="280" width="328" height="138" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="240" y="317" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">4. Biological hypothesis</text><text x="240" y="352" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Cell-state, locus regulation,</text><text x="240" y="377" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">or architecture—still inferred</text><rect x="570" y="280" width="328" height="138" rx="13" fill="#F1E7DA" stroke="#E7DED2"/><text x="590" y="317" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">5. Independent validation</text><text x="590" y="352" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Replicates, perturbations and</text><text x="590" y="377" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">orthogonal assays</text><path d="M378 184 H392 M725 184 H739 M907 260 Q907 270 906 276 M568 350 H553" stroke="#AA7857" stroke-width="3" fill="none"/><text x="51" y="468" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Use matched controls and make the uncertainty explicit at every step.</text></svg>
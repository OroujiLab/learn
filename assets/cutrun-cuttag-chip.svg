<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1238 759" role="img" aria-labelledby="title desc"><title id="title">Mechanistic comparison of ChIP-seq, CUT&amp;RUN and CUT&amp;Tag</title><desc id="desc">Three stepwise original panels: ChIP-seq uses immunoprecipitation after chromatin fragmentation; CUT&amp;RUN uses target antibody tethered pA/G-MNase and calcium-mediated cleavage; CUT&amp;Tag uses antibody tethered adapter-loaded pA/G-Tn5 and magnesium-mediated tagmentation. These are simplified schematics.</desc><rect width="1238" height="759" fill="#FFFEFB"/><text x="51" y="59" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="400" fill="#4A3024" >Where the DNA fragments come from</text><text x="52" y="91" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#7B695C" >Three profiling strategies · different molecular mechanisms · different backgrounds</text><rect x="40" y="123" width="372" height="560" rx="16" fill="#F8F5EF" stroke="#E8DCCF" stroke-width="1.5"/><text x="63" y="168" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" fill="#4A3024" >ChIP-seq</text><text x="63" y="194" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#7B695C" >Immunoprecipitation after fragmentation</text><text x="63" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#8B654E" letter-spacing="1.3">FRAGMENT → ENRICH</text><rect x="58" y="245" width="336" height="163" rx="9" fill="#FFFEFB" stroke="#E8DCCF" stroke-width="1.5"/><path d="M 83 285 L83.0 285.0 L94.5 290.7 L106.0 293.0 L117.5 290.7 L129.0 285.0 L140.5 279.3 L152.0 277.0 L163.5 279.3 L175.0 285.0 L186.5 290.7 L198.0 293.0 L209.5 290.7 L221.0 285.0 L232.5 279.3 L244.0 277.0 L255.5 279.3 L267.0 285.0 L278.5 290.7 L290.0 293.0 L301.5 290.7 L313.0 285.0 " stroke="#8B654E" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="113" cy="289.6326287680761" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="171" cy="282.41195172662214" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="229" cy="284.51595344247505" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="287" cy="288.3639638381233" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><path d="M226 280 l-13 -15 M226 280 l13 -15 M226 280 v16" fill="none" stroke="#4A3024" stroke-width="3.2" stroke-linecap="round"/><path d="M98 339 h56 m20 0 h48 m20 0 h55" stroke="#8B654E" stroke-width="5" stroke-linecap="round"/><rect x="275" y="318" width="56" height="32" rx="16" fill="#F2EAE0" stroke="#D8C2AE"/><text x="287" y="340" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#4A3024" >IP</text><text x="66" y="443" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Crosslink when appropriate;</text><text x="66" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >fragment chromatin</text><text x="66" y="503" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Capture target-bound DNA</text><text x="66" y="533" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >with specific antibody</text><text x="66" y="563" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Reverse crosslinks if used;</text><text x="66" y="593" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >recover and sequence DNA</text><path d="M62 631 h328" stroke="#E8DCCF" stroke-width="1.5"/><text x="65" y="657" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#8B654E" >DNA enrichment by immunoprecipitation</text><rect x="434" y="123" width="372" height="560" rx="16" fill="#F9F2EB" stroke="#E8DCCF" stroke-width="1.5"/><text x="457" y="168" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" fill="#4A3024" >CUT&amp;RUN</text><text x="457" y="194" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#7B695C" >Antibody-directed nuclease cleavage</text><text x="457" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#8B654E" letter-spacing="1.3">TETHER → CLEAVE</text><rect x="452" y="245" width="336" height="163" rx="9" fill="#FFFEFB" stroke="#E8DCCF" stroke-width="1.5"/><path d="M 477 313 L477.0 313.0 L489.3 318.7 L501.5 321.0 L513.8 318.7 L526.0 313.0 L538.3 307.3 L550.5 305.0 L562.8 307.3 L575.0 313.0 L587.3 318.7 L599.5 321.0 L611.8 318.7 L624.0 313.0 L636.3 307.3 L648.5 305.0 L660.8 307.3 L673.0 313.0 L685.3 318.7 L697.5 321.0 L709.8 318.7 L722.0 313.0 " stroke="#8B654E" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="507" cy="317.8242315449188" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="565" cy="309.09760944813956" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="623" cy="315.33547483977475" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="681" cy="312.617500585208" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><path d="M613 295 l-13 -15 M613 295 l13 -15 M613 295 v16" fill="none" stroke="#4A3024" stroke-width="3.2" stroke-linecap="round"/><rect x="594" y="255" width="100" height="31" rx="15" fill="#4A3024"/><text x="607" y="276" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#FFFEFB" >pA/G-MNase</text><path d="M562 339 l-12 18 m24 -18 l12 18" stroke="#B48765" stroke-width="3"/><text x="469" y="384" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#8B654E" >Ca²⁺ → cleavage</text><text x="460" y="443" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Permeabilized nuclei;</text><text x="460" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >antibody binds target</text><text x="460" y="503" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >pA/G-MNase binds antibody</text><text x="460" y="533" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Ca²⁺ activates DNA cleavage</text><text x="460" y="563" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Recover nearby released fragments;</text><text x="460" y="593" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >prepare sequencing library</text><path d="M456 631 h328" stroke="#E8DCCF" stroke-width="1.5"/><text x="459" y="657" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#8B654E" >Target-proximal MNase-cleaved fragments</text><rect x="828" y="123" width="372" height="560" rx="16" fill="#F8F5EF" stroke="#E8DCCF" stroke-width="1.5"/><text x="851" y="168" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" fill="#4A3024" >CUT&amp;Tag</text><text x="851" y="194" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#7B695C" >Antibody-directed adapter insertion</text><text x="851" y="228" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#8B654E" letter-spacing="1.3">TETHER → TAG</text><rect x="846" y="245" width="336" height="163" rx="9" fill="#FFFEFB" stroke="#E8DCCF" stroke-width="1.5"/><path d="M 871 313 L871.0 313.0 L883.3 318.7 L895.5 321.0 L907.8 318.7 L920.0 313.0 L932.3 307.3 L944.5 305.0 L956.8 307.3 L969.0 313.0 L981.3 318.7 L993.5 321.0 L1005.8 318.7 L1018.0 313.0 L1030.3 307.3 L1042.5 305.0 L1054.8 307.3 L1067.0 313.0 L1079.3 318.7 L1091.5 321.0 L1103.8 318.7 L1116.0 313.0 " stroke="#8B654E" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="901" cy="317.8242315449188" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="959" cy="309.09760944813956" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="1017" cy="315.33547483977475" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><circle cx="1075" cy="312.617500585208" r="11" fill="#D8C2AE" stroke="#8B654E" stroke-width="1.4"/><path d="M1011 294 l-13 -15 M1011 294 l13 -15 M1011 294 v16" fill="none" stroke="#4A3024" stroke-width="3.2" stroke-linecap="round"/><rect x="988" y="255" width="109" height="31" rx="15" fill="#4A3024"/><text x="1000" y="276" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#FFFEFB" >pA/G-Tn5</text><path d="M928 306 v-31 m0 0 l-7 7 m7 -7 l7 7 M1092 306 v-31 m0 0 l-7 7 m7 -7 l7 7" stroke="#B48765" stroke-width="3" fill="none"/><text x="863" y="384" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#8B654E" >Mg²⁺ → adapter insertion</text><text x="854" y="443" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Permeabilized nuclei;</text><text x="854" y="473" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >antibody binds target</text><text x="854" y="503" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Adapter-loaded pA/G-Tn5</text><text x="854" y="533" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >is tethered at the antibody</text><text x="854" y="563" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >Mg²⁺ triggers tagmentation;</text><text x="854" y="593" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4A3024" >amplify tagged DNA</text><path d="M850 631 h328" stroke="#E8DCCF" stroke-width="1.5"/><text x="853" y="657" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#8B654E" >Target-proximal adapter-tagged DNA</text><text x="47" y="728" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#7B695C" >Simplified assay mechanisms, not a complete protocol. Antibody specificity, nuclei handling, target type and controls remain critical.</text></svg>
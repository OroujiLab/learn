<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="at atd"><title id="at">What ATAC-seq can reveal and how quality control changes interpretation</title><desc id="atd">Original vector concept: Tn5-mediated tagging of accessible chromatin, fragment-size classes, a synthetic transcription-start-site enrichment curve and questions about FRiP, sequencing depth and controls. No real data.</desc><rect width="1200" height="710" fill="#FFFEFB"/><text x="44" y="54" font-family="Arial,Helvetica,sans-serif" font-size="33" fill="#4A3024" font-weight="400">ATAC-seq: measurement before mechanism</text><text x="44" y="86" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">From accessible DNA fragments to a credible regulatory hypothesis</text><rect x="44" y="118" width="548" height="252" rx="12" fill="#F8F5EF" stroke="#E7DED2" stroke-width="1.5"/><rect x="612" y="118" width="543" height="252" rx="12" fill="#F8F5EF" stroke="#E7DED2" stroke-width="1.5"/><rect x="44" y="388" width="548" height="255" rx="12" fill="#F8F5EF" stroke="#E7DED2" stroke-width="1.5"/><rect x="612" y="388" width="543" height="255" rx="12" fill="#F8F5EF" stroke="#E7DED2" stroke-width="1.5"/><text x="66" y="156" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">01   Transposase-accessible DNA</text><text x="66" y="185" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Tn5 inserts sequencing adapters at accessible regions.</text><path d="M80 267 C128 205 177 308 236 257 S340 210 397 271 S492 295 551 252" stroke="#9F785E" stroke-width="5" fill="none"/><ellipse cx="118" cy="255" rx="20" ry="15" fill="#D8C2AE" stroke="#73533F"/><ellipse cx="220" cy="259" rx="20" ry="15" fill="#D8C2AE" stroke="#73533F"/><ellipse cx="318" cy="259" rx="20" ry="15" fill="#D8C2AE" stroke="#73533F"/><ellipse cx="478" cy="273" rx="20" ry="15" fill="#D8C2AE" stroke="#73533F"/><path d="M372 225 L387 255 M402 225 L387 255" stroke="#4A3024" stroke-width="4" stroke-linecap="round"/><text x="363" y="209" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4A3024" font-weight="400">Tn5</text><text x="67" y="343" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#73533F" font-weight="400">Accessibility ≠ enhancer activation or gene targeting</text><text x="634" y="156" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">02   Fragment-length profile</text><text x="634" y="185" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Synthetic distributions vary across preparations.</text><rect x="658" y="311" width="18" height="15" fill="#73533F" rx="3"/><rect x="687" y="291" width="18" height="35" fill="#73533F" rx="3"/><rect x="716" y="248" width="18" height="78" fill="#73533F" rx="3"/><rect x="745" y="234" width="18" height="92" fill="#73533F" rx="3"/><rect x="774" y="266" width="18" height="60" fill="#73533F" rx="3"/><rect x="803" y="301" width="18" height="25" fill="#73533F" rx="3"/><rect x="832" y="306" width="18" height="20" fill="#D8C2AE" rx="3"/><rect x="861" y="290" width="18" height="36" fill="#D8C2AE" rx="3"/><rect x="890" y="266" width="18" height="60" fill="#D8C2AE" rx="3"/><rect x="919" y="282" width="18" height="44" fill="#D8C2AE" rx="3"/><rect x="948" y="305" width="18" height="21" fill="#D8C2AE" rx="3"/><rect x="977" y="291" width="18" height="35" fill="#D8C2AE" rx="3"/><rect x="1006" y="283" width="18" height="43" fill="#D8C2AE" rx="3"/><rect x="1035" y="293" width="18" height="33" fill="#D8C2AE" rx="3"/><rect x="1064" y="312" width="18" height="14" fill="#D8C2AE" rx="3"/><path d="M650 329 H1126" stroke="#73533F" stroke-width="2"/><text x="658" y="352" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#73533F" font-weight="400">Short / nucleosome-free</text><text x="851" y="352" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#73533F" font-weight="400">Mono- and di-nucleosomal</text><text x="66" y="428" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">03   TSS enrichment</text><text x="66" y="458" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#73533F" font-weight="400">Aggregate accessibility near annotated TSS positions.</text><path d="M76 583 H556 M316 489 V583" stroke="#D8C2AE" stroke-width="2" stroke-dasharray="6 7"/><path d="M76 578 L76 563.0 L84 564.0 L92 567.0 L100 571.3 L108 576.3 L116 581.0 L124 584.7 L132 586.6 L140 586.5 L148 584.2 L156 580.2 L164 575.0 L172 569.4 L180 564.2 L188 559.9 L196 557.1 L204 555.7 L212 555.3 L220 555.5 L228 555.2 L236 553.6 L244 549.9 L252 543.7 L260 534.8 L268 523.6 L276 510.9 L284 497.9 L292 485.9 L300 476.3 L308 470.1 L316 468.0 L324 470.4 L332 476.9 L340 486.7 L348 498.7 L356 511.6 L364 524.1 L372 535.0 L380 543.5 L388 549.4 L396 552.9 L404 554.4 L412 554.7 L420 554.8 L428 555.4 L436 557.1 L444 560.3 L452 564.8 L460 570.2 L468 575.8 L476 580.9 L484 584.7 L492 586.6 L500 586.4 L508 584.2 L516 580.3 L524 575.5 L532 570.6 L540 566.4 L548 563.7 L556 563.0" stroke="#4A3024" stroke-width="4" fill="none"/><text x="281" y="612" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4A3024" font-weight="400">Annotated TSS</text><text x="67" y="633" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#73533F" font-weight="400">Peak shape is illustrative; not a universal QC cutoff.</text><text x="634" y="428" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">04   QC requires multiple dimensions</text><text x="634" y="457" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#73533F" font-weight="400">Assess together, not as a single pass/fail number.</text><text x="636" y="492" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4A3024" font-weight="400">Read mapping and library complexity</text><rect x="958" y="479" width="165" height="11" rx="4" fill="#E8DBCE"/><rect x="958" y="479" width="130" height="11" rx="4" fill="#9F785E"/><text x="636" y="527" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4A3024" font-weight="400">TSS enrichment consistency</text><rect x="958" y="514" width="165" height="11" rx="4" fill="#E8DBCE"/><rect x="958" y="514" width="107" height="11" rx="4" fill="#9F785E"/><text x="636" y="562" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4A3024" font-weight="400">FRiP and background distribution</text><rect x="958" y="549" width="165" height="11" rx="4" fill="#E8DBCE"/><rect x="958" y="549" width="117" height="11" rx="4" fill="#9F785E"/><text x="636" y="597" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4A3024" font-weight="400">Replicate agreement</text><rect x="958" y="584" width="165" height="11" rx="4" fill="#E8DBCE"/><rect x="958" y="584" width="135" height="11" rx="4" fill="#9F785E"/><text x="45" y="688" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#73533F" font-weight="400">All signals are conceptual. ATAC-seq assesses DNA accessibility; downstream mechanistic interpretation requires independent evidence.</text></svg>
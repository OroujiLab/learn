<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 585" role="img" aria-labelledby="title desc"><title id="title">Genomic table to Gosling specification to genomic tracks</title><desc id="desc">Original three-panel diagram explaining data tables, declarative JSON-like track encodings, and an illustrative genome viewer with cytobands, signals and interval annotations. All examples synthetic.</desc><rect width="1270" height="585" fill="#FFFEFB"/><text x="50" y="55" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#4A3024">How Gosling turns genomic data into a visualization</text><text x="52" y="84" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#73533F">An expressive encoding of coordinates, annotations and numerical signals</text><rect x="45" y="115" width="372" height="411" rx="15" fill="#F8F5EF" stroke="#E8DCCF"/><text x="69" y="153" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A97A51">01 / DATA</text><text x="69" y="190" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#4A3024">BED + bedGraph</text><rect x="448" y="115" width="372" height="411" rx="15" fill="#F4EAE0" stroke="#E8DCCF"/><text x="472" y="153" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A97A51">02 / SPECIFICATION</text><text x="472" y="190" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#4A3024">Declarative encoding</text><rect x="851" y="115" width="372" height="411" rx="15" fill="#F8F5EF" stroke="#E8DCCF"/><text x="875" y="153" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A97A51">03 / VISUALIZATION</text><text x="875" y="190" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#4A3024">Genome-aligned tracks</text><rect x="66" y="230" width="324" height="43" rx="5" fill="#FFFEFB"/><text x="77" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4A3024">chrom</text><text x="157" y="257" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4A3024">
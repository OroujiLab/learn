<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 790" role="img" aria-labelledby="t d"><title id="t">Assay-family atlas for three-dimensional genome mapping</title><desc id="d">A comparative educational matrix categorizing 3C, 4C, 5C, Capture Hi-C, Hi-C, Micro-C, HiChIP, PLAC-seq, GAM and SPRITE by measurement approach.</desc><rect width="1120" height="790" fill="#FFFEFB"/><text x="48" y="56" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="34">How can we measure 3D genome organization?</text><text x="48" y="88" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">Choose the assay based on its observable—not merely the names of its output files.</text><rect x="48" y="124" rx="12" width="1024" height="143" fill="#FCFAF7" stroke="#E7DED2"/><text x="69" y="153" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="15">LIGATION-BASED · TARGETED</text><text x="69" y="182" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">3C · one vs one</text><text x="69" y="204" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">4C · viewpoint vs genome</text><text x="69" y="226" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">5C · many vs many</text><text x="69" y="248" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Capture Hi-C · enrichment for chosen regions</text><line x1="641" y1="144" x2="641" y2="244" stroke="#E7DED2" stroke-width="2"/><text x="670" y="182" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">Crosslinked contacts selected around</text><text x="670" y="210" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">specified loci or probe sets.</text><rect x="48" y="277" rx="12" width="1024" height="143" fill="#F8F5EF" stroke="#E7DED2"/><text x="69" y="306" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="15">LIGATION-BASED · GENOME-WIDE</text><text x="69" y="335" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Hi-C · genome-wide paired contacts</text><text x="69" y="357" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Micro-C · MNase-fragmented chromatin</text><line x1="641" y1="297" x2="641" y2="397" stroke="#E7DED2" stroke-width="2"/><text x="670" y="335" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">Genome-scale pairwise contact maps;</text><text x="670" y="363" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">resolution depends on data and design.</text><rect x="48" y="430" rx="12" width="1024" height="143" fill="#FCFAF7" stroke="#E7DED2"/><text x="69" y="459" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="15">ENRICHMENT-COUPLED</text><text x="69" y="488" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">HiChIP · antibody-enriched proximity contacts</text><text x="69" y="510" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">PLAC-seq · protein-associated contacts</text><line x1="641" y1="450" x2="641" y2="550" stroke="#E7DED2" stroke-width="2"/><text x="670" y="488" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">Contacts sampled through targeted</text><text x="670" y="516" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">chromatin-protein enrichment.</text><rect x="48" y="583" rx="12" width="1024" height="143" fill="#F8F5EF" stroke="#E7DED2"/><text x="69" y="612" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="600" font-size="15">LIGATION-FREE / MULTIWAY</text><text x="69" y="641" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">GAM · nuclear-profile co-segregation</text><text x="69" y="663" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">SPRITE · split-pool DNA complex barcoding</text><line x1="641" y1="603" x2="641" y2="703" stroke="#E7DED2" stroke-width="2"/><text x="670" y="641" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">Not classical proximity ligation;</text><text x="670" y="669" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="18">supports different contact observables.</text><text x="49" y="764" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="15">Methods do not share identical biases, sensitivity or contact definitions. Pairwise signals are not equivalent to resolved 3D coordinates.</text></svg>
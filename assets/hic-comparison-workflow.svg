<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 565" role="img" aria-labelledby="t d"><title id="t">Comparative Hi-C analysis with replication and validation</title><desc id="d">Five clearly separated cards for experimental design, comparable inputs, structural feature inference, statistical support and biological validation.</desc><rect width="1120" height="565" fill="#FFFEFB"/><text x="48" y="53" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="34">Before calling a differential structure</text><text x="48" y="83" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="17">A visual contrast, a reproducible signal and a causal mechanism are distinct claims.</text><rect x="48" y="119" width="328" height="158" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="68" y="156" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">1. Experimental design</text><text x="68" y="191" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Biological replicates; pairing;</text><text x="68" y="216" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">genome build; batch; cell states</text><rect x="395" y="119" width="328" height="158" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="415" y="156" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">2. Comparable matrices</text><text x="415" y="191" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Valid-pair depth, cis/trans,</text><text x="415" y="216" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">distance decay, CNV and biases</text><rect x="742" y="119" width="328" height="158" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="762" y="156" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">3. Quantitative comparison</text><text x="762" y="191" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Shared bins, documented scales,</text><text x="762" y="216" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">appropriate contact statistics</text><rect x="224" y="303" width="328" height="158" rx="13" fill="#F8F5EF" stroke="#E7DED2"/><text x="244" y="340" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">4. Replicate support</text><text x="244" y="375" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Within-condition variability,</text><text x="244" y="400" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">multiple tests, robust effect sizes</text><rect x="571" y="303" width="328" height="158" rx="13" fill="#F1E7DA" stroke="#E7DED2"/><text x="591" y="340" fill="#4A3024" font-family="Arial,Helvetica,sans-serif" font-weight="500" font-size="22">5. Functional relevance</text><text x="591" y="375" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Perturbation or orthogonal</text><text x="591" y="400" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">evidence where warranted</text><path d="M380 191 H392 M728 191 H740 M907 281 V298 M556 385 H568" stroke="#AA7857" stroke-width="3" fill="none"/><text x="48" y="516" fill="#73533F" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="16">Interpretation: do not confuse per-sample colour autoscaling with reproducible quantitative change.</text></svg>
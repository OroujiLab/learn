"500" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#4A3024" >3  Peak calls and benchmark metrics</text><text x="68" y="526" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#7B695C" >Overlap alone does not quantify correctness</text><text x="260" y="561" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#7B695C" >Caller A</text><rect x="509.35" y="548" width="80.85000000000001" height="22" rx="6" fill="#4A3024"/><rect x="884.1999999999999" y="548" width="80.85" height="22" rx="6" fill="#4A3024"/><text x="260" y="604" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#7B695C" >Caller B</text><rect x="472.6" y="591" width="139.64999999999998" height="22" rx="6" fill="#B48765"/><rect x="737.2" y="591" width="44.09999999999996" height="22" rx="6" fill="#B48765"/><rect x="876.85" y="591" width="139.65000000000003" height="22" rx="6" fill="#B48765"/><path d="M47 659 H1150" stroke="#E8DCCF" stroke-width="1"/><text x="58" y="686" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4A3024" >Evaluate: orthogonal positives/negatives · precision and recall · reproducibility · peak boundaries · assay-specific biases</text><text x="58" y="713" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#7B695C" >All genomic positions, reference labels and signals above are invented teaching examples; reference 'truth' itself requires careful validation.</text></svg>
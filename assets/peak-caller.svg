<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 738" role="img" aria-labelledby="title desc"><title id="title">CUT&amp;RUN peak-caller benchmarking evidence diagram</title><desc id="desc">A synthetic benchmark with a reference evidence row, two sample signal replicates, independent Caller A and Caller B interval calls, and explicit precision/recall, replicate stability and boundary evaluation. It avoids treating caller agreement as ground truth.</desc><rect width="1200" height="738" fill="#FFFEFB"/><text x="50" y="54" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="400" fill="#4A3024" >What would make a convincing peak-caller benchmark?</text><text x="50" y="88" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#7B695C" >Separate experimental signal, independent evidence and caller behaviour</text><rect x="47" y="116" width="1103" height="108" rx="12" fill="#F8F5EF" stroke="#E8DCCF" stroke-width="1.5"/><rect x="47" y="237" width="1103" height="219" rx="12" fill="#FBF8F3" stroke="#E8DCCF" stroke-width="1.5"/><rect x="47" y="470" width="1103" height="170" rx="12" fill="#F8F5EF" stroke="#E8DCCF" stroke-width="1.5"/><text x="68" y="153" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#4A3024" >1  Reference evidence</text><text x="68" y="180" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#7B695C" >Orthogonally supported positives</text><text x="68" y="202" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7B695C">and well-chosen negative loci</text><path d="M355 201 H1090" stroke="#D8C2AE" stroke-width="2.3"/><path d="M450.6 195 v12" stroke="#4A3024" stroke-width="1.5"/><text x="433.55" y="217" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7B695C" >13%</text><path d="M649.0 195 v12" stroke="#4A3024" stroke-width="1.5"/><text x="632" y="217" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7B695C" >40%</text><path d="M862.1 195 v12" stroke="#4A3024" stroke-width="1.5"/><text x="845.15" y="217" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7B695C" >69%</text><path d="M994.5 195 v12" stroke="#4A3024" stroke-width="1.5"/><text x="977.45" y="217" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="400" fill="#7B695C" >87%</text><rect x="516.7" y="177" width="60.27" height="21" rx="4" fill="#B48765"/><rect x="898.9" y="177" width="58.065" height="21" rx="4" fill="#B48765"/><rect x="722.5" y="177" width="33.074999999999996" height="21" rx="4" fill="#E8DCCF"/><text x="68" y="267" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#4A3024" >2  Independent signal profiles</text><text x="68" y="292" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7B695C">Replication, enrichment</text><text x="68" y="315" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#7B695C">and matched controls</text><text x="258" y="341" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#8B654E" >replicate 1</text><path d="M355.00 354.00 L364.19 350.80 L373.38 348.31 L382.56 347.07 L391.75 347.38 L400.94 349.14 L410.13 351.99 L419.31 354.00 L428.50 354.00 L437.69 353.99 L446.88 353.95 L456.06 353.79 L465.25 353.28 L474.44 351.85 L483.63 345.97 L492.81 336.66 L502.00 324.42 L511.19 310.37 L520.38 297.74 L529.56 290.97 L538.75 292.76 L547.94 300.70 L557.13 314.25 L566.31 328.59 L575.50 340.08 L584.69 347.47 L593.88 351.37 L603.06 351.30 L612.25 349.05 L621.44 347.39 L630.63 347.03 L639.81 348.17 L649.00 350.59 L658.19 353.77 L667.38 354.00 L676.56 354.00 L685.75 354.00 L694.94 354.00 L704.13 354.00 L713.31 354.00 L722.50 352.95 L731.69 349.90 L740.88 347.76 L750.06 347.00 L759.25 347.79 L768.44 349.95 L777.63 353.02 L786.81 354.00 L796.00 354.00 L805.19 353.99 L814.38 353.95 L823.56 353.81 L832.75 353.43 L841.94 352.17 L851.13 346.91
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" role="img" aria-labelledby="ot od"><title id="ot">Experimental design of cancer organoid epigenomics</title><desc id="od">Six-step study design connecting patient-derived sample provenance, independent organoid lines, matched experimental batches, epigenomics assays, integrative inference and validation. All examples hypothetical.</desc><rect width="1200" height="628" fill="#FFFEFB"/><text x="44" y="54" font-family="Arial,Helvetica,sans-serif" font-size="33" fill="#4A3024" font-weight="400">An organoid is a model, not a patient</text><text x="44" y="86" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Design the evidence chain before sequencing the first library</text><rect x="44" y="132" width="348" height="185" rx="12" fill="#F8F5EF" stroke="#E7DED2" stroke-width="1.5"/><text x="64" y="170" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">01  Sample provenance</text><text x="64" y="209" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Consent and de-identification</text><text x="64" y="239" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Primary / metastatic origin</text><text x="64" y="269" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Tissue handling, purity</text><path d="M395 222 l20 0" stroke="#9F785E" stroke-width="3"/><rect x="423" y="132" width="348" height="185" rx="12" fill="#F8F5EF" stroke="#E7DED2" stroke-width="1.5"/><text x="443" y="170" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">02  Biological units</text><text x="443" y="209" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Independent PDO lines</text><text x="443" y="239" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Passage and culture conditions</text><text x="443" y="269" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Copy number / genotype</text><path d="M774 222 l20 0" stroke="#9F785E" stroke-width="3"/><rect x="802" y="132" width="348" height="185" rx="12" fill="#F8F5EF" stroke="#E7DED2" stroke-width="1.5"/><text x="822" y="170" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">03  Assay allocation</text><text x="822" y="209" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Randomize batches</text><text x="822" y="239" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Matched controls / replicates</text><text x="822" y="269" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Viability and input QC</text><rect x="44" y="348" width="348" height="185" rx="12" fill="#F5EFE8" stroke="#E7DED2" stroke-width="1.5"/><text x="64" y="386" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">04  Molecular readouts</text><text x="64" y="425" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">ATAC / histone profiling</text><text x="64" y="455" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">RNA / optional multiome</text><text x="64" y="485" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Genome conformation if needed</text><path d="M395 438 l20 0" stroke="#9F785E" stroke-width="3"/><rect x="423" y="348" width="348" height="185" rx="12" fill="#F5EFE8" stroke="#E7DED2" stroke-width="1.5"/><text x="443" y="386" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">05  Integrated hypotheses</text><text x="443" y="425" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Cell-state programs</text><text x="443" y="455" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Enhancer–gene candidates</text><text x="443" y="485" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Confounder-aware models</text><path d="M774 438 l20 0" stroke="#9F785E" stroke-width="3"/><rect x="802" y="348" width="348" height="185" rx="12" fill="#F5EFE8" stroke="#E7DED2" stroke-width="1.5"/><text x="822" y="386" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#4A3024" font-weight="400">06  Causal validation</text><text x="822" y="425" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Targeted perturbation</text><text x="822" y="455" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Independent lines / rescues</text><text x="822" y="485" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#73533F" font-weight="400">Clinical utility is separate</text><text x="45" y="606" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#73533F" font-weight="400">Patient-derived organoids lack many tumour microenvironment compartments; molecular associations do not alone predict treatment benefit.</text></svg>